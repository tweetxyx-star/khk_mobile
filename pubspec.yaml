name: khk_mobile
description: "KHK Cricket Academy Mobile App"
publish_to: 'none'

version: 1.0.1+17

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
    
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.2
  http: ^1.6.0
  collection: ^1.18.0
  shared_preferences: ^2.5.5
  provider: ^6.1.5+1
  flutter_stripe: ^12.6.0
  flutter_svg: ^2.3.0
  google_fonts: ^8.1.0
  app_links: ^6.3.2
  intl: ^0.20.2
  pinput: ^5.0.0
  image_picker: ^1.2.3
  http_parser: ^4.0.2
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_messaging: ^16.4.1  # Changed from 15.1.3
  flutter_local_notifications: ^18.0.1
  webview_flutter: ^4.14.1
  youtube_player_iframe: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#000000"
    theme_color: "#00FF00"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"